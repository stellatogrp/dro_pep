hydra:
  run:
    dir: /nfs/sloanlab007/projects/pdopt_proj/vranjan/dro_pep/src/iclr_data_outputs/learn_lpep_outputs/LogReg/${now:%Y-%m-%d}/${now:%H-%M-%S}_12
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/nfs/sloanlab007/projects/pdopt_proj/vranjan/dro_pep/src/iclr_data_outputs/learn_lpep_outputs/LogReg/${now:%Y-%m-%d}/${now:%H-%M-%S}_12
    - hydra.job.chdir=True
    - hydra.mode=RUN
    task:
    - learning_framework=lpep
    - pep_obj=obj_val
    - sgd_iters=500
    - alg=nesterov_fgm
    - eta_t=1e-4
    - K_max=[5]
  job:
    name: run_learning_lpep_experiment
    chdir: true
    override_dirname: K_max=[5],alg=nesterov_fgm,eta_t=1e-4,learning_framework=lpep,pep_obj=obj_val,sgd_iters=500
    id: ???
    num: ???
    config_name: logreg.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.2'
    cwd: /nfs/sloanlab007/projects/pdopt_proj/vranjan/dro_pep/src
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /nfs/sloanlab007/projects/pdopt_proj/vranjan/dro_pep/src/configs_learning
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /nfs/sloanlab007/projects/pdopt_proj/vranjan/dro_pep/src/iclr_data_outputs/learn_lpep_outputs/LogReg/2026-09-20/11-48-10_12
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
