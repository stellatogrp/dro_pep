mu: 0
L: 1
eta: 1  # final step size = eta / L
dim: 300
R: 10  # placeholder, overwritten by compute_R (max ||x*||)
ref_N: 200  # number of x* draws used to set R = max ||x*||

K_min: 1
K_max: 10

alg: nesterov_grad_desc  # grad_desc or nesterov_grad_desc
dro_obj: cvar # expectation or cvar
dro_pep_obj: obj_val  # obj_val or grad_sq_norm or opt_dist_sq_norm

precond: false  # true = apply preconditioning; false = identity (no preconditioning)
precond_type: average # 'average' or 'max' or 'min' (only used when precond: true)

seed:
  full_samples: 0
  train: 100
  R_ref: 200

sample_N: 100
cross_val_repeats: 100

training:
  expectation_N: 1
  cvar_N: 1
  lyap_N: 1
num_clusters:
  expectation: null
  cvar: null

sample_fname: samples.csv
pep_fname: pep.csv
dro_fname: dro.csv

eps:
  space_type: logspace   # logspace or linspace
  log_min: -1             # base grid of the archived K=50 runs: logspace(-1, 1, 13)
  log_max: 1
  space_count: 13
# The figure data also includes a small-radius extension, logspace(-3, -1.3, 6),
# run via slurm_scripts/run_cert_dro_chunk.sh with CEXP=quad CTRIM=3
# CARGS="alg=... eps.log_min=-3 eps.log_max=-1.3 eps.space_count=6".
# The grid must reach the SAA limit: a bottom that is too high silently
# inflates the certificates (cross-validation pins there; measured CVaR
# inflation up to 12x at K=40 on the un-extended grid).
alpha_vals: [0.01, 0.05, 0.10]