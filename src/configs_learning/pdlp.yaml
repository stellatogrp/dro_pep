# ----------------------------------------------------------------------------
# TV Inpainting on Olivetti Faces (PDLP)
#
# Replaces the previous facility-location LP. Sample creation uses the helpers
# in src/learning/tv_inpainting_test.py.
# ----------------------------------------------------------------------------

# --- Image / dataset ---
image_M: 64                  # Olivetti images are 64x64
image_N: 64
n_subjects_total: 40         # full Olivetti dataset
images_per_subject: 10       # consecutive blocks of 10 share a subject
n_subjects_train: 28         # 70%
n_subjects_val: 4            # 10%
n_subjects_test: 8           # 20%

# --- Corruption ---
missing_fraction_in_dist: 0.1     # used for train/val/test pools
missing_fraction_out_of_dist: 0.2 # heavier corruption -> distribution shift for OOD
scaled_lp_01: true               # mirrors SCALED_LP_01; lp_upper derived in code
                                  # (true => lp_upper=1.0, false => lp_upper=255.0)
# --- PDHG initialization ---
# The PEP construction requires (x0, y0) in the strict interior of
# [l, u] x (R^{m1}_+ x R^{m2}). Sample creation (for R_val) and the trainer
# must use the same init; the trainer checks it against the sample metadata.
#   center: x0 = 0.5 * lp_upper * ones                (original init)
#   warm:   x0 = [clip(corrupted image, d, 1-d); |D p0| + d] * lp_upper, d = warm_delta
#   consistent: x0 = known pixels + neighbour-mean fill, slacks |D p0| + d; y0 = TV subgradient
#           of |D p0| and known-pixel stationary equality duals (dual_* keys ignored); R ~ 27
#   consistent_holes: same, but missing pixels start at 0.5 (the corrupted image) instead of the fill
#   y0 = [dual_ineq * ones(m1); zeros(m2)], dual_ineq = 0.5 if warm_dual else 0.1,
#   unless dual_init is set: then y0 = dual_init * ones(m1 + m2) (paper: 1.0)
# (see build_pdhg_init / _make_cp_tv_traj_fn in learning_experiment_classes/pdlp.py)
init_type: center
warm_delta: 0.01
warm_dual: false
dual_init: null

# --- Forward model ---
# Gaussian blur (std in pixels) applied before masking: the LP observes the
# blurred image at the known pixels, A = [E H, 0], b = (H p_orig)[known].
# 0 = plain inpainting (the original experiment). Center init only.
blur_sigma: 0.0

# --- Seeds ---
person_split_seed: 12345
training_mask_seed_base: 40000
val_mask_seed_base: 10000
test_mask_seed_base: 20000
ood_mask_seed_base: 30000

# --- Operator-norm / IC-radius safety factors (Lasso-analog) ---
m_safety_factor: 1.2
r_safety_factor: 1.1
# Training-time R_val (null = sample-creation value). Must be >= it.
R_val_override: null

# ----------------------------------------------------------------------------
# Algorithm / framework (carried forward; consumed once learning wiring lands)
# ----------------------------------------------------------------------------
alg: 'cp'                               # PDLP uses Chambolle-Pock
pep_obj: 'obj_val'                      # 'obj_val' = duality gap, 'opt_dist_sq_norm' = ||z_K - z*||^2, 'opt_primal_dist_sq_norm' = ||x_K - x*||^2
learning_framework: 'ldro-pep'          # 'ldro-pep', 'l2o', or 'lpep'

stepsize_type: "vector"                 # "scalar" or "vector"
vector_init: "fixed"                    # only 'fixed' supported for CP today

learn_tau: True
learn_sigma: True
learn_theta: True

# ----------------------------------------------------------------------------
# Loss composition
# ----------------------------------------------------------------------------
training_loss_type_composition: "weighted"
validation_loss_type_composition: "final"
decay_rate: 0.9

# ----------------------------------------------------------------------------
# Batch sampling. The pool sizes are pinned by the person split (fixed at the
# pool size, one mask per image — see plan); we still expose training_sample_N
# etc. for downstream loaders that read them.
# ----------------------------------------------------------------------------
N: 5                                   # SGD minibatch size
training_sample_N: 280                  # = n_subjects_train * images_per_subject
out_of_sample_val_N: 40                 # = n_subjects_val * images_per_subject
out_of_sample_test_N: 80                # = n_subjects_test * images_per_subject
out_of_dist_N: 400                      # full dataset

K_max: [5]
sgd_seed: 500

# ----------------------------------------------------------------------------
# DRO / SDP
# ----------------------------------------------------------------------------
dro_obj: "expectation"                  # "expectation" or "cvar"
sdp_backend: "diffcp"
dro_canon_backend: "manual_jax"         # "manual_jax" or "cvxpylayers"
# Gradient of the SDP optimal value: 'envelope' (exact y x^T / -y, no linear
# solve) or 'diffcp' (LSQR adjoint of the solution map). diffcp's adjoint is
# too inaccurate for this badly scaled SDP (FD check: tools/pdlp_grad_bisect.py).
sdp_value_grad: "envelope"
eps: 0.1
alpha: 0.1
precond_type: 'identity'

# ----------------------------------------------------------------------------
# SGD training parameters
# ----------------------------------------------------------------------------
optimizer_type: "adamw"
sgd_iters: 1000
eta_t: 1e-3
weight_decay: 1e-5
grad_clip_norm: 1.0

# ----------------------------------------------------------------------------
# Outputs
# ----------------------------------------------------------------------------
output_dir: "learn_dro_outputs"
# ICLR campaign sets, generated on MIT Sloan by
#   run.sh --stage sample-creation --exp all --cluster
data_source_dir: /nfs/sloanlab007/projects/pdopt_proj/vranjan/dro_pep/src/iclr_data_outputs/sample_creation_outputs/PDLP/2026-09-18/08-51-13
