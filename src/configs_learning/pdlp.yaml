n_facilities: 5
n_customers: 20

fixed_costs:
  l: 1.0
  u: 2.0

demands:
  l: 0.5
  u: 1.5

transportation_costs:
  l: 0.1
  u: 1.0

base_capacity:
  base: 2.0
  scaling: 1.5

warmstart: False

# ----------------------------------------------------------------------------
# Algorithm / framework
# ----------------------------------------------------------------------------
alg: 'cp'                               # PDLP uses Chambolle-Pock
pep_obj: 'obj_val'                      # duality gap is the only CP metric
learning_framework: 'ldro-pep'          # 'ldro-pep', 'l2o', or 'lpep'

# Step size configuration
stepsize_type: "vector"                 # "scalar" or "vector"
vector_init: "fixed"                    # only 'fixed' supported for CP today

# Which step sizes to learn (PDHG has tau, sigma, theta)
learn_tau: True
learn_sigma: True
learn_theta: True

# ----------------------------------------------------------------------------
# Loss composition
# ----------------------------------------------------------------------------
training_loss_type_composition: "weighted"
validation_loss_type_composition: "final"
decay_rate: 0.9

# ----------------------------------------------------------------------------
# Batch sampling
# ----------------------------------------------------------------------------
N: 20                                   # minibatch size
training_sample_N: 20                   # total pre-sampled training instances
precond_sample_size: 100                # M_val / R_val estimation pool
precond_sample_seed: 20260421

out_of_sample_val_N: 10
out_of_sample_val_seed: 10000
out_of_sample_test_N: 20
out_of_dist_N: 20

# K_max loop inside pdlp_run (per-K CSV logging)
K_max: [1]

sgd_seed: 500

# ----------------------------------------------------------------------------
# DRO / SDP
# ----------------------------------------------------------------------------
dro_obj: "expectation"                  # "expectation" or "cvar"
sdp_backend: "diffcp"
dro_canon_backend: "manual_jax"         # "manual_jax" or "cvxpylayers"
eps: 0.1
alpha: 0.1
precond_type: 'average'

# ----------------------------------------------------------------------------
# SGD training parameters
# ----------------------------------------------------------------------------
optimizer_type: "adamw"
sgd_iters: 10
eta_t: 1e-3                             # learning rate for stepsizes
weight_decay: 1e-3                      # weight decay for sgd_wd

# ----------------------------------------------------------------------------
# Outputs
# ----------------------------------------------------------------------------
output_dir: "learn_dro_outputs"
